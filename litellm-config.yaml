model_list:
  - model_name: smartphone-chat
    litellm_params:
      model: os.environ/OPENAI_MODEL
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
      rpm: 10
      tpm: 500
      num_retries: 3

  - model_name: smartphone-embeddings
    litellm_params:
      model: os.environ/OPENAI_EMBEDDINGS_MODEL
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
      mode: embedding
      num_retries: 5

litellm_settings:
  drop_params: true
  max_budget: 5
  max_end_user_budget: 0.002
  budget_duration: 1d
  request_timeout: 600
  set_verbose: false
  json_logs: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
