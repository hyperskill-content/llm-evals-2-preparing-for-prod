# LiteLLM proxy configuration for the smartphone assistant.
#
# Values written as os.environ/NAME are read from the container environment
# (litellm/.env), so no secrets are stored in this file.
#
# Budgets are in US dollars (USD), not cents.

model_list:
  # Chat model used by the context, review and goodbye chains and by the
  # guardrails self-check. The app requests it by model_name.
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
      # Deployment limits. One user turn makes about 3 chat calls (guardrail,
      # context, review) of roughly 300 to 1500 tokens each, so these allow
      # about 10 turns per minute. The task template's 500 tokens per minute
      # would block a single turn.
      rpm: 30      # requests per minute
      tpm: 30000   # tokens per minute
      num_retries: 3

  # Embeddings model used to build the Qdrant collection and embed searches
  - model_name: text-embedding-ada-002
    litellm_params:
      model: openai/text-embedding-ada-002
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
      num_retries: 5
    model_info:
      mode: embedding

litellm_settings:
  drop_params: true
  # Proxy-wide spend cap that resets every budget_duration [USD]
  max_budget: 1.00
  # Default cap for each end user (the "user" field the app sends) [USD per
  # budget_duration]. About 30 turns per user per day with gpt-4o-mini.
  max_end_user_budget: 0.01
  budget_duration: 1d
  request_timeout: 600  # [seconds]
  set_verbose: false
  json_logs: true
  # Not sending logs to Langfuse from the proxy: the app already traces every
  # call with the Langfuse callback handler, so this would duplicate them.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
